[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "onetech-ao"
version = "0.1.0"
description = "Collecteur HAICOP vers PostgreSQL pour OneTech Tender Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
onetech-ao = "onetech_ao.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
markers = [
    "integration: tests requiring the local PostgreSQL Docker service",
    "network: tests contacting public HAICOP endpoints",
]
