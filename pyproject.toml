[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "onetech-ao"
version = "0.2.0"
description = "Pipeline HAICOP, PostgreSQL et analyse OpenClaw pour OneTech Tender Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "mcp>=1.29,<2",
    "psycopg[binary]>=3.2,<4",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
deliverables = [
    "Markdown>=3.10,<4",
    "PyMuPDF>=1.26,<2",
    "python-docx>=1.1,<2",
    "python-pptx>=1.0,<2",
]

[project.scripts]
onetech-ao = "onetech_ao.cli:main"
onetech-ao-mcp = "onetech_ao.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
markers = [
    "integration: tests requiring the local PostgreSQL Docker service",
    "network: tests contacting public HAICOP endpoints",
]
